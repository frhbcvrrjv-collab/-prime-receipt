<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PRIME Receipt</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: white;
    font-family: Arial, sans-serif;
    color: black;
}

.receipt {
    width: 80mm;
    margin: auto;
    padding: 5mm 6mm;
}

.logo {
    text-align: center;
    margin-bottom: 8mm;
}

.logo-main {
    font-size: 13mm;
    font-weight: bold;
    letter-spacing: 1px;
}

.logo-sub {
    font-size: 3.8mm;
}

.info {
    font-size: 3.6mm;
    line-height: 1.5;
}

hr {
    border: 0;
    border-top: 0.3mm solid black;
    margin: 5mm 0;
}

.label {
    font-weight: bold;
    font-size: 4mm;
}

.value {
    font-size: 4.5mm;
    margin-bottom: 3mm;
}

.item {
    display: flex;
    justify-content: space-between;
    gap: 3mm;
    font-size: 4.2mm;
    margin: 3mm 0;
}

.item-price {
    white-space: nowrap;
}

.total {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    font-size: 5.5mm;
    margin-top: 5mm;
}

.payment {
    font-size: 4.2mm;
    margin-top: 7mm;
}

.pickup {
    text-align: center;
    font-weight: bold;
    font-size: 4.5mm;
    line-height: 1.5;
    margin-top: 24mm;
}

.arabic {
    direction: rtl;
    margin-bottom: 3mm;
}

.thanks {
    text-align: center;
    margin-top: 18mm;
    font-size: 4mm;
}

button {
    width: 100%;
    margin-top: 10mm;
    padding: 4mm;
    border: none;
    background: black;
    color: white;
    font-weight: bold;
    font-size: 4mm;
    cursor: pointer;
}

@media print {

    @page {
        size: 80mm auto;
        margin: 0;
    }

    body {
        width: 80mm;
    }

    .receipt {
        width: 80mm;
        margin: 0;
    }

    button {
        display: none;
    }
}
</style>
</head>

<body>

<div class="receipt">

    <div class="logo">
        <div class="logo-main">PRIME</div>
        <div class="logo-sub">— &nbsp; CAR WASH &nbsp; —</div>
    </div>

    <div class="info">
        Receipt #: <span id="receipt"></span><br>
        Date: <span id="date"></span>
        &nbsp;
        Time: <span id="time"></span>
    </div>

    <hr>

    <div class="label">CAR</div>
    <div class="value" id="car"></div>

    <div class="label">PLATE</div>
    <div class="value" id="plate"></div>

    <hr>

    <div id="items"></div>

    <hr>

    <div class="total">
        <span>TOTAL</span>
        <span><span id="total"></span> JOD</span>
    </div>

    <div class="payment">
        Payment: <span id="payment"></span>
    </div>

    <div class="pickup">

        <div class="arabic">
            يرجى إبراز هذا الإيصال عند استلام المفتاح
        </div>

        <div>
            Please present this receipt to<br>
            collect your key
        </div>

    </div>

    <div class="thanks">
        Thank you for choosing <b>PRIME</b>
    </div>

    <button onclick="window.print()">PRINT RECEIPT</button>

</div>

<script>

const p = new URLSearchParams(window.location.search);

function value(name, fallback) {
    return p.get(name) || fallback;
}

document.getElementById("receipt").textContent =
    value("receipt", "000000");

document.getElementById("date").textContent =
    value("date", "");

document.getElementById("time").textContent =
    value("time", "");

document.getElementById("car").textContent =
    value("car", "");

document.getElementById("plate").textContent =
    value("plate", "");

document.getElementById("total").textContent =
    value("total", "0.00");

document.getElementById("payment").textContent =
    value("payment", "");

const itemsBox = document.getElementById("items");

const items = p.get("items");

if (items) {

    items.split(";").forEach(function(item) {

        const parts = item.split("|");

        if (parts.length < 2) return;

        const row = document.createElement("div");
        row.className = "item";

        const name = document.createElement("span");
        name.textContent = parts[0];

        const price = document.createElement("span");
        price.className = "item-price";
        price.textContent = parts[1] + " JOD";

        row.appendChild(name);
        row.appendChild(price);

        itemsBox.appendChild(row);

    });

}

</script>

</body>
</html>
