<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRIME Car Wash Receipt</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #fff;
    color: #000;
    font-family: Arial, Helvetica, sans-serif;
  }

  .receipt {
    width: 80mm;
    min-height: 200mm;
    margin: 0 auto;
    padding: 5mm 6mm;
    background: white;
  }

  .logo {
    text-align: center;
    margin-bottom: 8mm;
  }

  .prime {
    font-size: 15mm;
    line-height: 0.9;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .car-wash {
    margin-top: 3mm;
    font-size: 4mm;
    letter-spacing: 0.5px;
  }

  .meta {
    font-size: 3.5mm;
    line-height: 1.5;
  }

  hr {
    border: 0;
    border-top: 0.3mm solid #000;
    margin: 5mm 0;
  }

  .label {
    font-size: 4mm;
    font-weight: 700;
    margin-bottom: 1mm;
  }

  .value {
    font-size: 4.5mm;
    margin-bottom: 3mm;
  }

  .item {
    display: flex;
    justify-content: space-between;
    gap: 4mm;
    font-size: 4.2mm;
    margin: 3mm 0;
  }

  .item-name {
    flex: 1;
  }

  .item-price {
    white-space: nowrap;
  }

  .total {
    display: flex;
    justify-content: space-between;
    font-size: 5.5mm;
    font-weight: 700;
    margin: 5mm 0;
  }

  .payment {
    font-size: 4.2mm;
    margin-top: 6mm;
  }

  .pickup {
    text-align: center;
    font-weight: 700;
    margin-top: 24mm;
    font-size: 4.5mm;
    line-height: 1.5;
  }

  .arabic {
    direction: rtl;
    font-size: 4.5mm;
    margin-bottom: 3mm;
  }

  .thanks {
    text-align: center;
    margin-top: 18mm;
    font-size: 4mm;
  }

  .print-button {
    width: 100%;
    border: none;
    background: #000;
    color: #fff;
    font-size: 4mm;
    font-weight: 700;
    padding: 4mm;
    margin-top: 10mm;
    cursor: pointer;
  }

  @media print {
    @page {
      size: 80mm auto;
      margin: 0;
    }

    body {
      width: 80mm;
    }

    .receipt {
      margin: 0;
      width: 80mm;
    }

    .print-button {
      display: none !important;
    }
  }
</style>
</head>

<body>

<div class="receipt">

  <div class="logo">
    <div class="prime">PRIME</div>
    <div class="car-wash">— &nbsp; CAR WASH &nbsp; —</div>
  </div>

  <div class="meta">
    <div>Receipt #: <span id="receipt"></span></div>
    <div>
      Date: <span id="date"></span>
      &nbsp; Time: <span id="time"></span>
    </div>
  </div>

  <hr>

  <div class="label">CAR</div>
  <div class="value" id="car"></div>

  <div class="label">PLATE</div>
  <div class="value" id="plate"></div>

  <hr>

  <div id="items"></div>

  <hr>

  <div class="total">
    <span>TOTAL</span>
    <span id="total"></span>
  </div>

  <div class="payment">
    Payment: <span id="payment"></span>
  </div>

  <div class="pickup">
    <div class="arabic">
      يرجى إبراز هذا الإيصال عند استلام المفتاح
    </div>

    <div>
      Please present this receipt to<br>
      collect your key
    </div>
  </div>

  <div class="thanks">
    Thank you for choosing <strong>PRIME</strong>
  </div>

  <button class="print-button" onclick="window.print()">
    PRINT RECEIPT
  </button>

</div>

<script>
  const params = new URLSearchParams(window.location.search);

  function get(name, fallback = "") {
    return params.get(name) || fallback;
  }

  function safeText(id, value) {
    document.getElementById(id).textContent = value;
  }

  safeText("receipt", get("receipt", "000000"));
  safeText("date", get("date", ""));
  safeText("time", get("time", ""));
  safeText("car", get("car", ""));
  safeText("plate", get("plate", ""));
  safeText("payment", get("payment", ""));
  
  const total = get("total", "0.00");
  safeText("total", total + " JOD");

  const itemsContainer = document.getElementById("items");

  /*
    ITEMS FORMAT:

    Wash Name|5.00;Air Freshener|1.00;Microfiber Cloth|2.00
  */

  const itemsString = get("items", "");

  if (itemsString) {
    const items = itemsString.split(";");

    items.forEach(item => {
      const parts = item.split("|");

      if (parts.length >= 2) {
        const name = parts[0];
        const price = parts[1];

        const row = document.createElement("div");
        row.className = "item";

        const itemName = document.createElement("span");
        itemName.className = "item-name";
        itemName.textContent = name;

        const itemPrice = document.createElement("span");
        itemPrice.className = "item-price";
        itemPrice.textContent = price + " JOD";

        row.appendChild(itemName);
        row.appendChild(itemPrice);

        itemsContainer.appendChild(row);
      }
    });
  }
</script>

</body>
</html>
